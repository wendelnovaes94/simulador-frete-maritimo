<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulador de frete Marítimo - Shipping</title>
<style>
:root {
  --paper: #f3efe6;
  --paper-deep: #e7e0d2;
  --sheet: #fffdf8;
  --ink: #1a2330;
  --navy: #16324f;
  --sea: #1f6f62;
  --sea-soft: #e5f2ef;
  --muted: #5e675f;
  --line: #ddd4c4;
  --brass: #8d6428;
  --danger: #8c3a32;
  --danger-soft: #f8ebe8;
  color: var(--ink);
  background: var(--paper);
  font-family: "Segoe UI", "Source Sans 3", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 560; color: var(--navy); }
h1 { font-size: clamp(1.7rem, 3vw, 2.4rem); line-height: 1.15; margin: 0; }
h2 { font-size: 1.35rem; margin: 0 0 0.75rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
#app { max-width: 1440px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header { border-bottom: 1px solid var(--line); padding-bottom: 1rem; margin-bottom: 1rem; }
.brand { display: flex; gap: 0.75rem; align-items: center; }
.mark {
  width: 2.75rem; height: 2.75rem; border-radius: 1rem; background: var(--navy); flex: none;
  background-image: linear-gradient(160deg, #2a5278, var(--navy));
  box-shadow: inset 0 -8px 0 var(--sea);
}
.kicker { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sea); font-weight: 700; margin: 0 0 0.2rem; }
.lead, .note { color: var(--muted); font-size: 0.92rem; line-height: 1.4; }
.lead { max-width: 42rem; margin-top: 0.75rem; }
.presets { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.presets button, .actions button {
  border: 1px solid var(--line); background: var(--sheet); color: var(--navy);
  border-radius: 999px; padding: 0.45rem 0.8rem;
}
.presets button.ghost { background: transparent; color: var(--muted); }
.layout { display: grid; gap: 1.1rem; align-items: start; }
@media (min-width: 980px) {
  .layout { grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.15fr); }
  #out { position: sticky; top: 0.75rem; }
}
.card {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 1.25rem; padding: 1rem;
  margin-bottom: 1rem; min-width: 0;
}
.slots { display: grid; gap: 0.75rem; }
@media (min-width: 720px) { .slots, .grid2, .locks, .kpis { grid-template-columns: 1fr 1fr; } }
.slots, .grid2, .locks, .kpis { display: grid; gap: 0.6rem; }
.slot { background: rgba(243, 239, 230, 0.7); border: 1px solid var(--line); border-radius: 1rem; padding: 0.75rem; min-width: 0; }
.field { display: block; min-width: 0; }
.field span, .locks span, .kpi span { display: block; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 0.25rem; }
input, select {
  width: 100%; height: 2.7rem; border-radius: 0.8rem; border: 1px solid var(--line); background: var(--sheet);
  padding: 0 0.7rem; min-width: 0;
}
input:focus, select:focus { outline: 2px solid var(--sea); border-color: var(--sea); }
.locked { height: 2.7rem; border-radius: 0.8rem; border: 1px solid var(--line); background: var(--paper); display: flex; align-items: center; justify-content: space-between; padding: 0 0.7rem; }
.locked span { color: var(--brass); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
.big { font-size: 2rem; font-weight: 650; color: var(--navy); margin: 0.5rem 0 0.15rem; }
.field em { font-style: normal; color: var(--brass); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 0.35rem; }
.grid2 > button, #form .card > button.ghost { border: 1px solid var(--line); background: var(--sheet); color: var(--navy); border-radius: 1rem; padding: 0.7rem 0.8rem; text-align: left; }
.grid2 > button.on { background: var(--navy); color: var(--sheet); border-color: var(--navy); }
button.ghost { margin-top: 0.45rem; background: transparent; border: 0; color: var(--sea); text-align: left; padding: 0; }
.warn { color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem; }
.route-line { margin-top: 0.8rem; color: var(--navy); font-weight: 650; }
.seg { display: flex; flex-wrap: wrap; background: var(--paper-deep); border-radius: 1rem; padding: 0.2rem; margin: 0.8rem 0; max-width: 100%; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 0.4rem 0.75rem; }
.seg button.on { background: var(--navy); color: var(--sheet); }
.locks div { background: var(--paper); border: 1px solid var(--line); border-radius: 0.8rem; padding: 0.5rem 0.7rem; }
.locks strong { color: var(--navy); }
.check { display: flex; gap: 0.45rem; align-items: flex-start; margin-top: 0.55rem; font-size: 0.92rem; }
.check input { width: 1rem; height: 1rem; margin-top: 0.15rem; accent-color: var(--sea); }
.kpi { border: 1px solid var(--line); background: var(--sheet); border-radius: 1rem; padding: 0.7rem 0.8rem; min-width: 0; }
.kpi.sea { background: var(--sea); color: var(--sheet); border-color: var(--sea); }
.kpi.sea span, .kpi.sea em { color: rgba(255, 253, 248, 0.82); }
.kpi strong { display: block; font-size: 1rem; }
.kpi em { font-style: normal; color: var(--muted); font-size: 0.78rem; }
.sheet-h, .driver-h, .steps li { display: flex; justify-content: space-between; gap: 0.8rem; align-items: flex-start; }
.actions { display: flex; gap: 0.4rem; }
.layout, #form, #out, .card, .slot, .scroll, .kpis { min-width: 0; }
.scroll { overflow-x: auto; margin-top: 0.8rem; max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 36rem; }
th { text-align: left; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0.4rem 0.45rem; }
td { border-top: 1px solid var(--line); padding: 0.45rem; vertical-align: top; }
.sub { display: block; color: var(--muted); font-size: 0.75rem; }
.mid { background: rgba(243, 239, 230, 0.8); font-weight: 700; color: var(--navy); }
.total { background: var(--navy); color: var(--sheet); font-weight: 700; }
.total td { border-color: transparent; }
.strong { font-weight: 700; }
.danger { color: var(--danger); }
.broker { border-radius: 1rem; padding: 0.75rem; margin-top: 0.6rem; }
.broker.good { background: var(--sea-soft); }
.broker.bad { background: var(--danger-soft); }
.alert { background: var(--danger-soft); color: var(--danger); border-radius: 0.8rem; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem; }
.bars { display: flex; align-items: flex-end; gap: 0.25rem; margin-top: 0.6rem; }
.bar { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0; }
.bar i { display: block; width: 100%; border-radius: 0.35rem 0.35rem 0 0; background: var(--paper-deep); }
.bar.best i { background: var(--sea); }
.bar.now i { background: var(--navy); }
.bar span { font-size: 0.68rem; color: var(--muted); }
.drivers { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.8rem; }
.track { height: 0.45rem; background: var(--paper); border-radius: 999px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--navy); }
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { border-bottom: 1px solid var(--line); padding: 0.55rem 0; }
.steps strong { color: var(--navy); }
.steps p { color: var(--muted); font-size: 0.8rem; }
@media print {
  .presets, #form, .actions, .bars, .drivers, .steps { display: none !important; }
  #out { position: static; }
  body, .card { background: white; }
}

</style>
</head>
